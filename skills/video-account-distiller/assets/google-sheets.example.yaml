spreadsheet_id: replace-with-spreadsheet-id
range: Metrics!A:Z
token_env: GOOGLE_SHEETS_TOKEN
columns:
  - video_id
  - snapshot_at
  - views
  - likes
  - comments
  - shares
  - saves
authorization:
  grant_id: replace-with-grant-id
