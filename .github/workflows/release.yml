name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: release
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest
      - run: uv build
      - name: Smoke-test installed wheel
        run: |
          uv venv .release-venv --python 3.11
          uv pip install --python .release-venv/bin/python dist/video_account_distiller-*.whl
          .release-venv/bin/python -m video_account_distiller --version
          .release-venv/bin/python tools/release_acceptance.py \
            --fixtures tests/fixtures \
            --report acceptance-linux.json
      - name: Create checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          evidence="release-evidence/video-account-distiller-public-beta-${version}.zip"
          test -f "${evidence}"
          cp "${evidence}" dist/
          (cd skills && zip -r "../dist/video-account-distiller-skill-${version}.zip" video-account-distiller)
          (cd dist && sha256sum video_account_distiller-* video-account-distiller-skill-* video-account-distiller-public-beta-* > SHA256SUMS.txt)
      - name: Audit release candidate
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv run distiller release audit \
            --repository . \
            --artifacts dist \
            --public-beta-evidence "dist/video-account-distiller-public-beta-${version}.zip" \
            --require-public-beta-freeze \
            --json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/video_account_distiller-*.whl \
            dist/video_account_distiller-*.tar.gz \
            dist/video-account-distiller-skill-*.zip \
            dist/video-account-distiller-public-beta-*.zip \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --title "Video Account Distiller ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
