[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "video-account-distiller"
version = "1.0.0"
description = "Offline-first Agent Skill and Python toolkit for evidence-based video account analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "video-account-distiller contributors" }]
dependencies = [
  "duckdb>=1.3.2,<2",
  "fastapi>=0.115,<1",
  "jinja2>=3.1.6,<4",
  "pyarrow>=20,<24",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
  "python-multipart>=0.0.20",
  "requests>=2.32,<3",
  "streamlit>=1.44,<2",
  "tzdata>=2025.2",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
distiller = "video_account_distiller.cli:app"
distiller-api = "video_account_distiller.api.app:main"
distiller-web = "video_account_distiller.web.app:main"

[dependency-groups]
dev = [
  "httpx2>=2.9,<3",
  "mypy>=1.16,<2",
  "numpy>=2,<2.5",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "pytest-socket>=0.7,<1",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12.20250516",
]

[tool.hatch.build.targets.wheel]
packages = ["src/video_account_distiller"]

[tool.hatch.build.targets.wheel.force-include]
"skills/video-account-distiller/assets/prompts" = "video_account_distiller/features/prompts"

[tool.hatch.build.targets.sdist]
include = [
  "/src/video_account_distiller",
  "/skills/video-account-distiller",
  "/tools/release_acceptance.py",
  "/docs/production-release.md",
  "/docs/product-direction.md",
  "/docs/phase8-account-url-analysis.md",
  "/docs/account-media-enrichment.md",
  "/docs/phase8-media-enrichment-acceptance-2026-07-23.md",
  "/THIRD_PARTY_NOTICES.md",
  "/.gitmodules",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs/planning", "third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/video_account_distiller/cli.py" = ["B008"]
"src/video_account_distiller/api/router_analysis.py" = ["B008"]
"src/video_account_distiller/api/router_closed_loop.py" = ["B008"]
"src/video_account_distiller/api/router_reports.py" = ["B008"]
"src/video_account_distiller/web/**/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "pyarrow.*", "numpy", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-socket --cov=video_account_distiller --cov-report=term-missing --cov-fail-under=80"
markers = [
  "performance: local performance acceptance checks",
]
