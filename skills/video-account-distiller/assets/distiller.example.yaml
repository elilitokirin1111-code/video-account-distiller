project:
  name: example-project
  language: zh-CN
  timezone: Asia/Shanghai
analysis:
  default_sample_size: 40
  recent_sample_fraction: 0.2
  use_robust_zscore: true
  log_transform_metrics: true
  min_pattern_support: 3
  min_validated_rule_support: 10
  max_comments_per_analysis: 10000
platforms:
  cross_platform_raw_metric_comparison: false
privacy:
  redact_usernames_in_reports: true
  hash_comment_author_ids: true
  allow_cloud_model_upload: false
models:
  text_provider: null
  vision_provider: null
  vision_model: qwen3-vl:8b
  ollama_base_url: http://127.0.0.1:11434
  vision_batch_size: 4
  vision_timeout_seconds: 180
  require_schema_validation: true
  max_schema_attempts: 2
  allow_degraded_analysis: true
media:
  ffmpeg_path: null
  ffprobe_path: null
  scene_threshold: 0.3
  max_shots: 500
  max_keyframes: 12
  keyframe_width: 720
  audio_sample_rate: 8000
  audio_window_ms: 100
  silence_threshold_dbfs: -40.0
  max_audio_analysis_seconds: 600
  command_timeout_seconds: 180
  allow_degraded_without_ffmpeg: true
collaboration:
  request_timeout_seconds: 30
  max_retries: 3
  retry_base_seconds: 0.5
  max_batch_rows: 500
scoring:
  default_target_snapshot_age_hours: 72
  snapshot_plan_hours:
    - 1
    - 24
    - 72
    - 168
  prediction_metrics:
    - views
    - engagement_rate_by_view
  max_rule_score_adjustment: 5.0
reports:
  formats:
    - markdown
    - json
  include_evidence_index: true
